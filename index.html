<style id="estilo">
/* Layout: cabeçalho azul com o nome da assistente, conversa em coluna única e campo de pergunta fixo no rodapé. */
:root{
  --band:#1F3FA6; --band-ink:#FFFFFF; --bg:#EFF3FA; --surface:#FFFFFF; --ink:#14203A; --muted:#58657F; --line:#D8E0EE;
  --accent:#1F3FA6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB; --bubble-me:#1F3FA6; --bubble-me-ink:#FFFFFF; --bad:#A8231B; --bad-bg:#FBE0DD;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif; --font-b:'Public Sans',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --band:#14307F; --bg:#0D1322; --surface:#171F34; --ink:#E6EBF7; --muted:#9BA8C6; --line:#29345A;
    --accent:#86A6FF; --accent-ink:#0D1322; --accent-soft:#1E2B52; --bubble-me:#2A4BBF; --bubble-me-ink:#FFFFFF; --bad:#FF9D94; --bad-bg:#40191A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --band:#14307F; --bg:#0D1322; --surface:#171F34; --ink:#E6EBF7; --muted:#9BA8C6; --line:#29345A;
  --accent:#86A6FF; --accent-ink:#0D1322; --accent-soft:#1E2B52; --bubble-me:#2A4BBF; --bubble-me-ink:#FFFFFF; --bad:#FF9D94; --bad-bg:#40191A; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55}
h1,h2{font-family:var(--font-d);margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button,textarea{font:inherit;color:inherit}
.top{background:var(--band);color:var(--band-ink);padding:26px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.top-in,.wrap{max-width:720px;margin:0 auto}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.82}
.top-in{display:flex;align-items:center;gap:16px}
.logo{flex:none;width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.9)}
.top h1{font-size:34px;margin-top:4px}
.ig{font-size:14px;opacity:.9;margin-top:2px}
.top p{margin-top:6px;opacity:.92;max-width:52ch}
.wrap{padding:20px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--accent);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:12px;min-width:0}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{align-self:flex-start;background:var(--bad-bg);color:var(--bad);font-weight:600}
.msg .who{display:block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px;letter-spacing:.04em}
.compose{position:sticky;bottom:0;background:var(--bg);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.compose-in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;max-height:140px}
textarea:focus-visible,.chip:focus-visible,.send:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.send{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 20px;min-height:48px;font-weight:700;cursor:pointer}
.send[disabled]{opacity:.55;cursor:not-allowed}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
summary{font-weight:700;cursor:pointer}
.info{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.info h2{font-size:16px;color:var(--accent)}
.info p{color:var(--ink);white-space:pre-wrap}
.info .soon{color:var(--muted);font-style:italic}
.space{height:8px}
.intro{color:var(--muted)}

.edit-btn{margin-top:12px;background:var(--surface);border:1px solid var(--line);color:var(--accent);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.edit-btn:focus-visible,.ed-in:focus-visible,.ed-ta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ed-item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.ed-in,.ed-ta{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--ink)}
.ed-ta{min-height:96px;resize:vertical}
.ed-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ed-note{color:var(--muted);font-size:14px}
.ed-err{color:var(--bad);font-weight:600;font-size:14px}
</style>

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ')}

var SEM_IA={not_granted:1,sampling_disabled:1,not_declared:1,capability_disabled:1,capability_removed:1};
async function ask(text){
  text=(text||'').trim();if(!text||busy)return;
  busy=true;send.disabled=true;q.value='';resize();
  bubble('me',text);
  if(!sample||aiOff){bubble('ai',local(text),'WESLEYANA');busy=false;send.disabled=false;q.focus();return}
  turns.push({role:'user',content:text});
  var out=bubble('ai','Pensando…','WESLEYANA');
  try{
    var r=await sample([{role:'user',content:regras()}].concat(turns.slice(-12)),{cache:false,modelTier:'quick',onText:function(u){out.textContent=u.text;out.scrollIntoView({block:'end'})}});
    out.textContent=r.text;turns.push({role:'assistant',content:r.text});
  }catch(e){
    turns.pop();
    if(e&&SEM_IA[e.code]){aiOff=true;out.textContent=local(text)}
    else{out.textContent=local(text)}
  }
  busy=false;send.disabled=false;q.focus();
}
function resize(){q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'}

/* ---------- edição pela própria página ---------- */
var PAGE_TOP='<title>Wesleyana</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">';
var RESET_PADRAO=':root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var FIM='</scr'+'ipt>';
function buildDoc(info){
  var hs=document.head&&document.head.querySelector('style:not(#estilo)');
  var reset=hs?hs.textContent:RESET_PADRAO;
  var json=JSON.stringify({info:info}).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    PAGE_TOP+'<style id="estilo">'+$('#estilo').textContent+'</style>'+
    '<template id="casca">'+$('#casca').innerHTML+'</template><div id="raiz"></div>'+
    '<script type="application/json" id="dados">'+json+FIM+
    '<script id="appjs">'+$('#appjs').textContent+FIM+'</body></html>';
}
function edRow(i){
  var w=document.createElement('div');w.className='ed-item';
  var t=document.createElement('input');t.className='ed-in';t.setAttribute('aria-label','Título');t.placeholder='Título (ex.: Cultos e horários)';t.value=i.t||'';
  var v=document.createElement('textarea');v.className='ed-ta';v.setAttribute('aria-label','Texto');v.placeholder='Texto que a Wesleyana vai usar';v.value=i.v||'';
  var r=document.createElement('button');r.type='button';r.className='edit-btn';r.textContent='Remover este item';r.onclick=function(){w.remove()};
  w.appendChild(t);w.appendChild(v);w.appendChild(r);return w;
}
function openEditor(){
  editing=true;var a=$('#editArea');a.innerHTML='';a.hidden=false;$('#editBtn').hidden=true;$('#info').hidden=true;
  var n=document.createElement('p');n.className='ed-note';n.textContent='Altere os textos e toque em Salvar. A página é atualizada para todos os visitantes.';a.appendChild(n);
  var list=document.createElement('div');list.id='edList';INFO.forEach(function(i){list.appendChild(edRow(i))});a.appendChild(list);
  var err=document.createElement('p');err.className='ed-err';err.id='edErr';err.hidden=true;
  var row=document.createElement('div');row.className='ed-row';
  var add=document.createElement('button');add.type='button';add.className='edit-btn';add.textContent='Adicionar item';add.onclick=function(){list.appendChild(edRow({t:'',v:''}))};
  var save=document.createElement('button');save.type='button';save.className='send';save.textContent='Salvar';
  var cancel=document.createElement('button');cancel.type='button';cancel.className='edit-btn';cancel.textContent='Cancelar';cancel.onclick=closeEditor;
  save.onclick=async function(){
    var info=[];Array.prototype.forEach.call(list.children,function(w){var t=w.querySelector('.ed-in').value.trim(),v=w.querySelector('.ed-ta').value.trim();if(t)info.push({t:t,v:v})});
    save.disabled=true;err.hidden=true;
    try{await artifactNs.publish(buildDoc(info));err.hidden=false;err.className='ed-note';err.textContent='Salvo. A página está recarregando.'}
    catch(e){
      var c=e&&e.code;err.className='ed-err';err.hidden=false;
      err.textContent=c==='conflict'?'Outra alteração foi publicada ao mesmo tempo. A página vai recarregar com a versão mais nova. Refaça a mudança se precisar.':c==='not_writer'||c==='not_granted'?'Você não tem permissão para editar esta página.':c==='too_large'?'O texto ficou grande demais. Reduza e tente de novo.':'Não foi possível salvar agora. Tente de novo em instantes.';
      save.disabled=false;
    }
  };
  row.appendChild(add);row.appendChild(save);row.appendChild(cancel);a.appendChild(err);a.appendChild(row);
}
function closeEditor(){editing=false;$('#editArea').hidden=true;$('#editArea').innerHTML='';$('#info').hidden=false;$('#editBtn').hidden=false}

/* ---------- início ---------- */
renderInfo();
try{fetch('info.json?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&Array.isArray(j.info)&&j.info.length){INFO=j.info;renderInfo()}}).catch(function(){})}catch(e){}
bubble('ai','A paz do Senhor! Eu sou a Wesleyana, assistente da '+IGREJA+'. Escreva a sua pergunta e eu respondo.','WESLEYANA');
$('#form').addEventListener('submit',function(e){e.preventDefault();ask(q.value)});
q.addEventListener('input',resize);
q.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(q.value)}});
$('#editBtn').addEventListener('click',openEditor);
(async function(){
  try{if(window.claude&&window.claude.use){
    sample=await window.claude.use('sample');
    userNs=await window.claude.use('user');
    artifactNs=await window.claude.use('artifact');
  }}catch(e){}
  var ed=false;try{ed=!!(userNs&&userNs.canEdit&&userNs.canEdit())}catch(e){}
  if(ed&&artifactNs){$('#editBtn').hidden=false;$('#infoBox').hidden=false}
})();
})();</script>
